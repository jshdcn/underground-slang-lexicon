name: Build slang lexicon

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - skill/underground-slang-index.md
      - skill/underground-slang-lexicon.md
      - skill/underground-slang-categories.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run merge scenarios
        run: python tests/test_scenarios.py

      - name: Build dictionary and index
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLANG_CACHE_DIR: ${{ runner.temp }}/slang-cache
        run: python tools/merge_local.py build --out skill/

      - name: Validate dictionary section structure
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          lexicon = pathlib.Path("skill/underground-slang-lexicon.md").read_text(
              encoding="utf-8"
          )
          sections = re.findall(r"(?m)^## (.+)$", lexicon)
          if not sections:
              sys.exit("Dictionary has no language or index sections")
          if len(sections) > 60:
              sys.exit(
                  f"Dictionary has {len(sections)} sections; expected at most 60. "
                  "Possible missing pypinyin dependency."
              )
          print(f"Dictionary section structure OK: {len(sections)} sections")
          PY

      - name: Commit generated files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skill/underground-slang-index.md skill/underground-slang-lexicon.md skill/underground-slang-categories.md
          if git diff --cached --quiet; then
            echo "Generated files are already up to date"
            exit 0
          fi
          git commit -m "chore(dict): rebuild generated lexicon"
          git push

      - name: Upload generated Markdown files
        uses: actions/upload-artifact@v4
        with:
          name: underground-slang-lexicon
          path: |
            skill/underground-slang-index.md
            skill/underground-slang-lexicon.md
            skill/underground-slang-categories.md
          if-no-files-found: error
          retention-days: 14
