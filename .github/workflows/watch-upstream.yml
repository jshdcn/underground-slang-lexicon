name: watch-upstream

# 每 30 分钟看一次上游。发现新提交就触发 ci.yml（repository_dispatch），
# 让重建与 20 个场景测试自动跑一遍——**上游任何更新都必须过 CI**。
#
# 本工作流自己不写仓库：合不合进 main 由人决定。这样上游半夜改词，
# 第二天 Actions 里已经有一次红的或绿的完整记录，人只需要看结论。

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: watch-upstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取上游最新 tree sha
        id: up
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          sys.path.insert(0, "tools")
          import merge_local as M
          # 与 build 写进 manifest 的是同一个函数、同一次 API 调用，两边必然可比
          print(f"sha={M.upstream_tree_sha()}")
          PY

      - name: 与上次构建记录比对
        id: cmp
        run: |
          if [ ! -f skill/manifest.json ]; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "仓库里没有 manifest.json，先跑一次 CI"
            exit 0
          fi
          OLD=$(python3 -c "import json;print(json.load(open('skill/manifest.json'))['upstream']['sha'])")
          NEW="${{ steps.up.outputs.sha }}"
          echo "仓库记录的上游：$OLD"
          echo "上游当前：      $NEW"
          if [ "$OLD" = "$NEW" ]; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "上游无新提交"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "上游有新提交 → 触发 CI"
          fi

      - name: 触发 CI
        if: steps.cmp.outputs.changed == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.up.outputs.sha }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d "{\"event_type\":\"upstream-updated\",\"client_payload\":{\"upstream_sha\":\"$SHA\"}}"
          echo "已触发 ci.yml"
