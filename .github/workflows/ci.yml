name: ci

# 上游一有更新、本仓一有推送，都必须过这里：重建产物 + 跑 20 个场景测试。
#
# 本工作流**只验证、不写仓库**。产物以 artifact 挂在本次 run 上，要不要合进 main
# 由人决定（本地 ./install.sh 后 push，那次 push 又会再跑一遍本 CI，等于双保险）。
#
# 触发来源：
#   push / pull_request      本仓自己的改动
#   repository_dispatch      watch-upstream 发现上游有新提交时转发过来
#   workflow_dispatch        手动跑

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: "上游 tree sha（watch-upstream 传入，仅作记录）"
        required: false
  repository_dispatch:
    types: [upstream-updated]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        # pypinyin 决定分节与排序：缺了会退回按 Unicode 码位排，产物结构完全不同
        run: pip install --quiet -r requirements.txt

      - name: 重建产物
        env:
          SLANG_CACHE_DIR: /tmp/slang-cache
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/merge_local.py build --out skill/

      - name: 跑场景测试
        run: python3 tests/test_scenarios.py

      - name: 校验分节结构
        # pypinyin 缺失时脚本只往 stderr 告警、不报错，这里硬拦一道
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          t = pathlib.Path("skill/underground-slang-lexicon.md").read_text(encoding="utf-8")
          secs = re.findall(r"(?m)^## (.+)$", t)
          if len(secs) > 60:
              sys.exit(f"分节 {len(secs)} 个，异常——疑似缺 pypinyin（正常约 30 个）")
          print(f"分节 {len(secs)} 个：{'、'.join(secs)}")
          PY

      - name: 与仓库里已提交的产物比对
        id: diff
        run: |
          git add -A skill local-data
          if git diff --cached --quiet; then
            echo "stale=no" >> "$GITHUB_OUTPUT"
            echo "产物与仓库一致"
          else
            echo "stale=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::重建结果与仓库里的不一致（上游已更新，或提交前没重建）"
            git diff --cached --stat
          fi

      - name: 写汇总
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          m = json.loads(pathlib.Path("skill/manifest.json").read_text(encoding="utf-8"))
          c, f = m["counts"], m["files"]
          print("### 词典 CI\n")
          print(f"- 触发方式：`${{ github.event_name }}`")
          print(f"- 上游：`{m['upstream']['repo']}` @ `{m['upstream']['sha'][:10]}`")
          print(f"- 词条 **{c['total']}**（上游 {c['upstream_terms']} 全量 + 本地独立 {c['local_terms']}）")
          print(f"- 同名合并：义项并立 {c['merged_local_senses']}、本地被覆盖 {c['overridden_local']}")
          print(f"- 别名 {c['aliases']} 条；按语种：" +
                "、".join(f"{k} {v}" for k, v in c["by_language"].items()))
          print(f"- 产物大小：词典 {f['underground-slang-lexicon.md']['bytes']//1024}KB、"
                f"索引 {f['underground-slang-index.md']['bytes']//1024}KB")
          stale = "${{ steps.diff.outputs.stale }}"
          print(f"- 产物与仓库是否一致：{'是' if stale == 'no' else '否（上游已更新，建议应用）'}")
          PY

      - name: 挂产物
        uses: actions/upload-artifact@v4
        with:
          name: slang-${{ github.run_id }}
          path: |
            skill/underground-slang-lexicon.md
            skill/underground-slang-index.md
            skill/manifest.json
          if-no-files-found: error
